bio: |
  أرناف غوش استراتيجي تقني وقائد منتجات متمرّس، يمتلك خبرة عميقة في بناء حلول رقمية قابلة للتوسّع ودفع الابتكار وقيادة المؤسسات عبر مبادرات التحوّل المعقّدة. وبأساس متين في هندسة البرمجيات ومسيرة مهنية امتدت عبر بيئات عديدة سريعة النمو، يجمع بين العمق التقني والفطنة التجارية والتميّز في التنفيذ.

  قاد أرناف فرقًا متعددة التخصصات في تطوير المنتجات والهندسة والاستراتيجية الرقمية، وقدّم حلولًا مؤثّرة في مجالات مثل المنصات السحابية وأنظمة المؤسسات والتطبيقات المعتمدة على البيانات. ويتميّز عمله بالتركيز على التصميم المتمحور حول المستخدم والكفاءة التشغيلية وقابلية التوسّع على المدى الطويل — مما يمكّن المؤسسات من تحديث منظوماتها التقنية مع تسريع طرح منتجاتها في السوق.

  ويُعرف أرناف بأسلوبه القيادي التعاوني وقدرته على تحويل المفاهيم التقنية المعقّدة إلى توجّهات استراتيجية واضحة، ويؤدّي دورًا أساسيًا في صياغة رؤية المنتجات وتحسين العمليات الهندسية وتوجيه الفرق نحو الأداء العالي. ويواصل دفع الابتكار عند تقاطع التكنولوجيا والأعمال، لمساعدة الشركات على بناء قدرات رقمية مرنة وجاهزة للمستقبل.

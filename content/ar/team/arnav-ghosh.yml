bio: |
  أرناف غوش خبير متمرس في استراتيجية التقنية وقائد في ابتكار المنتجات، يتمتع بخبرة عميقة في بناء حلول الأمن السيبراني والحوسبة السحابية على مستوى المؤسسات وتوسيع نطاقها. وبخبرة تزيد على عقد في قيادة استراتيجيات المنتجات عبر الأسواق العالمية، يتخصص في تحويل المنظومات التقنية المعقدة إلى منصات عالية الأثر تتمحور حول العميل وتسرّع أداء الأعمال.

  أمضى أرناف أكثر من 10 سنوات في مركز العمليات الأمنية العالمي لدى Symantec، حيث قاد إدارة المنتجات لخدمات أمنية مُدارة بالغة الأهمية تخدم أكثر من 500 عميل من المؤسسات حول العالم. وتركّز عمله على تصميم خطوط منتجات جديدة وإطلاقها، ورسم استراتيجية دعم الأجهزة، وإدارة دورة حياة المنتج كاملة بالتنسيق بين فرق الهندسة والمبيعات وتقديم الخدمات.

  وفي Accenture، ارتقى أرناف إلى قيادة المنتجات على مستوى عالٍ، فقاد مبادرات الابتكار، وطوّر عروض الأمن السيبراني، وواءم خرائط الطريق التقنية مع أهداف التحول المؤسسي. ويجمع نهجه بين التفكير المنهجي في المنتجات والإلمام القوي بالعمليات الهندسية، من ترتيب أولويات العمل وتصميم الميزات إلى أدوات التشغيل والتحليل المالي.

  ويُعرف أرناف بقدرته على الربط بين التقنية والأعمال وقيمة العميل، ويتميز ببناء أنظمة قابلة للتوسع، وتبسيط التعقيد، وتقديم منتجات آمنة ومرنة ومستعدة للمستقبل. ويعكس عمله باستمرار التزامًا بالوضوح الاستراتيجي والتعاون بين التخصصات والأثر الملموس.

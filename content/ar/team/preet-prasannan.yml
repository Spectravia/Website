bio: |
  بريت براسانان رائد أعمال تقني متمرّس وقائد هندسي واستراتيجي في تطوير الأعمال، يربط بين التميّز الهندسي وابتكار المنتجات والنمو التجاري. تمتد خبرته عبر الذكاء الاصطناعي والرؤية الحاسوبية والواقع المعزّز والواقع الممتد والواقع المعزّز عبر الويب (WebAR) وتقنيات الهاتف المحمول والمدفوعات والابتكار الرقمي. وقد بنى مسيرته على تحويل الأفكار إلى حلول رقمية قابلة للتوسع تحقق أثرًا ملموسًا في الأعمال.

  شغل بريت خلال مسيرته مناصب قيادية في شركات تقنية ناشئة ومؤسسات عالمية وشركات ابتكار سريعة النمو. وبصفته الرئيس التنفيذي والرئيس التنفيذي للتكنولوجيا سابقًا في Blippar، قاد تطوير الجيل التالي من منصات الواقع المعزّز، ومنها Blippbuilder وتقنية SLAM عبر الويب، ما أسهم في ترسيخ مكانة الشركة كمبتكر معروف في تجارب الواقع المعزّز.

  وبصفته شريكًا مؤسسًا في iKaaz، أسهم بريت في بناء شركة لتقنيات الدفع عبر الهاتف المحمول استحوذت عليها لاحقًا Grab، المنصة الرائدة في جنوب شرق آسيا لخدمات النقل والتطبيقات الشاملة. وتُظهر مسيرته الريادية قدرة قوية على اكتشاف فرص السوق، وبناء حلول تقنية قابلة للتوسع، وخلق القيمة من خلال الابتكار والتنفيذ.

  وفي مرحلة سابقة من مسيرته، شغل بريت منصب قائد البحث والتطوير في DreamWorks Animation، حيث قاد مبادرات بحث وتطوير تركّز على الابتكار الهندسي والتقني. كما تشمل خبرته المساهمة في منصات مالية عبر الهاتف المحمول لدى Obopay، دعمًا لحلول مثل Nokia Money وUnion Money وYes Money.

  تشمل خبرة بريت القيادة التقنية وهندسة المنتجات والمشاريع الريادية والمدفوعات عبر الهاتف المحمول والمنصات الرقمية والتقنيات الغامرة وحلول المؤسسات. ويمتلك خبرة واسعة في بناء منتجات تقنية قابلة للتوسع، وتصميم أنظمة معقدة، وقيادة الفرق الهندسية، وتحويل فرص الأعمال إلى حلول مبتكرة جاهزة للسوق. ويقع عمله باستمرار عند تقاطع التقنيات الناشئة واستراتيجية الأعمال.

  وبنهج عملي في الابتكار والتنفيذ، يركّز بريت على تطوير قدرات تقنية تحل مشكلات واقعية، وتعزز الكفاءة التشغيلية، وتخلق قيمة ملموسة للأعمال. وتمكّن قدرته على الجمع بين العمق التقني والرؤية التجارية المؤسساتِ من تسريع نموها مع الحفاظ على تركيز قوي على نتائج العملاء.

  وبفضل أساس متين في هندسة البرمجيات والتجارب الغامرة والأمن وتقنيات الدفع والتطبيقات واسعة النطاق، يقدّم بريت مزيجًا نادرًا من الرؤية الريادية والخبرة التقنية العميقة والقيادة التقنية على نطاق واسع. ويُعرف بتفكيره المنظم وأسلوبه القيادي التعاوني وقدرته على تبسيط التعقيد، ما يجعله مستشارًا موثوقًا للمؤسسات الساعية إلى الابتكار والتوسع والمنافسة في مشهد رقمي سريع التطور.

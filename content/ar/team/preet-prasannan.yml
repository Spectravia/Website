bio: |
  بريت رائد أعمال تقني متمرّس وقائد هندسي وخبير تقني، يتمتع بخبرة عميقة في تصميم وبناء أنظمة برمجية معقدة وتطبيقات ذكية ومنصات تقنية من الجيل التالي. وتمتد خبرته عبر الذكاء الاصطناعي وتعلّم الآلة والرؤية الحاسوبية والخوارزميات المتقدمة والحوسبة المكانية والواقع المعزّز والواقع الممتد والواقع المعزّز عبر الويب (WebAR) ومنصات الهاتف المحمول والأنظمة الموزّعة.

  وبفضل أساس متين في هندسة البرمجيات والبحث والتطوير وبنى التقنية واسعة النطاق، عمل بريت عبر جميع طبقات التقنية، من تصميم الخوارزميات والأنظمة الحاسوبية إلى تطوير النماذج وهندسة البرمجيات وهندسة المنصات والنشر. وتتركّز اهتماماته التقنية بشكل خاص عند تقاطع الذكاء الاصطناعي والرؤية الحاسوبية والذكاء البصري والأنظمة التفاعلية الآنية.

  ويجمع بين التفكير الهندسي المنطلق من المبادئ الأساسية والقيادة التقنية العملية، ما يمنحه القدرة على التعامل مع التحديات التقنية المعقدة، وتقييم البنى الناشئة، وتحويل الأبحاث والخوارزميات المتقدمة إلى أنظمة برمجية متينة وقابلة للتوسع. وتشمل خبرته بناء التقنية من الصفر، وقيادة فرق هندسية متعددة التخصصات، ونقل منصات تقنية متطورة من مرحلة البحث والنماذج الأولية إلى الإنتاج.

  Blippar، الرئيس التنفيذي والرئيس التنفيذي للتكنولوجيا سابقًا: قاد تطوير التقنية والهندسة لمنصات رائدة في الواقع المعزّز، وتولّى تطوير Blippbuilder وتقنية SLAM عبر الويب، بما تشمله من رؤية حاسوبية ورسم خرائط مكانية وتتبّع آني وعرض تفاعلي. وعمل في طليعة الحوسبة الغامرة عبر المتصفح والتقنيات البصرية المتقدمة.

  iKaaz، شريك مؤسس: شارك في تأسيس شركة لتقنيات الدفع عبر الهاتف المحمول، وبناء منصات الدفع الرقمي والبنية التقنية الداعمة لها. واستحوذت على الشركة لاحقًا Grab، التطبيق الشامل الرائد في جنوب شرق آسيا.

  DreamWorks Animation، قائد البحث والتطوير: قاد فريق البحث والتطوير، دافعًا الابتكار الهندسي والتقني المتقدم، وعمل على أنظمة برمجية وتقنيات حاسوبية معقدة في بيئة رسوم متحركة كثيفة البحث وعالية المتطلبات.

  Obopay (بدعم استثماري من Nokia): أسهم في هندسة وتطوير منصات التقنية المالية عبر الهاتف المحمول، ومنها Nokia Money وUnion Money وYes Money، بما يشمل البنية التحتية للهاتف المحمول والمعاملات الآمنة وأنظمة الدفع الرقمي.

  يجمع بريت بين الفهم الهندسي العميق والتفكير البحثي والخبرة في قيادة تطوير التقنيات المعقدة. وينطلق نهجه من فهم التقنية على مستوى جوهري: الخوارزميات والنماذج وهياكل البيانات والأساليب الحاسوبية وبنى الأنظمة التي تقوم عليها المنتجات البرمجية المتطورة.

  ويهتم بشكل خاص بتطوّر الأنظمة الذكية، وتقاطع الذكاء الاصطناعي والرؤية الحاسوبية، والحوسبة متعددة الوسائط، والذكاء المكاني، والتحديات الهندسية المرتبطة بنقل النماذج والخوارزميات المتقدمة إلى تطبيقات واقعية.

  وبعد عمله في بيئات قائمة على البحث وشركات تقنية ناشئة وتطوير منتجات واسعة النطاق، يدرك الموازنات التقنية في بناء أنظمة لا تكون مبتكرة فحسب، بل عالية الأداء وموثوقة وقابلة للتوسع وسهلة الصيانة.

  ويُعرف بريت بأسلوبه المنظم في حل المشكلات وفضوله التقني وقدرته على تبسيط التحديات الهندسية المعقدة، وقد قاد فرقًا في تطوير منصات تقنية متطورة، ويواصل استكشاف الآفاق التي تفتحها التطورات في الذكاء الاصطناعي وتعلّم الآلة والتقنيات الحاسوبية.

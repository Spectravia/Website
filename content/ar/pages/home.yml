        to: /case-studies/ai-voice-agent-collections
      - title: "20,000"
        text: دقيقة اتصال يتولّاها الذكاء الاصطناعي شهريًا
        to: /case-studies/ai-call-center-agent
  - id: services
    eyebrow: ماذا نقدّم
    title: قدرات تدفع المؤسسات إلى الأمام
    lead: ثلاثة مجالات خدمة متكاملة. نبني حلول الذكاء الاصطناعي والمنصات داخليًا، ونقدّم حلول الواقع الممتد المتخصّصة مع شركاء عالميين.
  - id: how
    eyebrow: كيف نعمل
    title: مسار واضح من الفكرة إلى الأثر
    lead: يمرّ كل مشروع بأربع مراحل، لترى القيمة مبكرًا وتتوسّع بثقة.
    items:
      - title: الاستكشاف
        text: نحدّد أهدافك وفرقك وأنظمتك، ونختار حالات الاستخدام ذات العائد الأوضح.
        icon: lucide:search
      - title: التجربة
        text: تجربة مركّزة تُثبت القيمة مع مستخدمين حقيقيين وأهداف قابلة للقياس، خلال أسابيع لا أشهر.
        icon: lucide:flask-conical
      - title: النشر
        text: ننشر الحل على نطاق واسع، متكاملًا مع أنظمتك وإجراءات الأمان والعمليات لديك.
        icon: lucide:rocket
      - title: التبنّي
        text: التدريب ودعم التغيير والتحسين المستمر تضمن أن يواصل الحل تحقيق العائد.
        icon: lucide:trending-up
  - id: industries
    eyebrow: القطاعات
    title: مصمّمة للقطاعات التي تحرّك المنطقة
    lead: من حقول النفط إلى قاعات المحاضرات، نكيّف التقنيات المُثبتة مع واقع كل قطاع.
  - id: cases
    eyebrow: دراسات الحالة
    title: أثر مُثبت ونتائج قابلة للقياس
    lead: مجموعة مختارة من مشاريع الذكاء الاصطناعي والواقع الممتد المنفّذة في المنطقة.
    cta:
      label: عرض جميع دراسات الحالة
      to: /case-studies
  - id: partners
    eyebrow: شركاؤنا
    title: نبني داخليًا، ونتوسّع مع متخصّصين عالميين
    lead: نصمّم حلول الذكاء الاصطناعي والمنصات ونبنيها داخليًا. وللاحتياجات المتخصّصة، نمثّل روّادًا عالميين في الشرق الأوسط وأفريقيا — Fifth Ingenium للواقع الممتد الصناعي، وBlippar للواقع المعزّز، وNext World للتدريب على السلامة بالواقع الافتراضي، وRPM Training Solutions لبرامج الأداء.
  - id: about
    eyebrow: من نحن
    title: تكنولوجيا يستخدمها فريقك فعلًا
    text: |
      Spectravia شركة تكنولوجيا مقرّها الإمارات وتخدم منطقة الشرق الأوسط وأفريقيا. نحوّل الذكاء الاصطناعي والواقع الممتد وبرمجيات المؤسسات إلى مهارات وأدوات ومنصات تستخدمها فرقك كل يوم، بقيادة فريق يمتلك أكثر من 20 عامًا من الخبرة القيادية المجتمعة.
    cta:
      label: تعرّف على الفريق
      to: /about

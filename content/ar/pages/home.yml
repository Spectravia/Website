sections:
  - id: intro
    image: /images/brand/innovation-studio.webp
    eyebrow: الخدمات المهنية لسبكترافيا
    title: طيف من الحلول الذكية، عبر مسار واضح
    text: |
      سبكترافيا شركة تكنولوجيا وابتكار أُسّست لتمكين المؤسسات في رحلتها نحو مستقبل التحوّل الرقمي. نجمع بين خبرة عميقة في الذكاء الاصطناعي وتقنية المعلومات والاتصالات والتقنيات الغامرة وبين الرؤية الاستراتيجية، لنساعد الشركات على اكتساب قدرات جديدة وتسريع النمو وبناء منظومات رقمية مرنة.

      نؤمن بأن الابتكار يجب أن يكون عمليًا ومتمحورًا حول الإنسان وموجّهًا نحو النتائج. ومن التدريب المتقدّم وبناء القدرات إلى المنصات الرقمية من الجيل التالي، نعمل مع عملائنا في مختلف القطاعات لصياغة تجارب أذكى وأداء أقوى وأثر مستدام على المدى الطويل.
  - id: pillars
    eyebrow: عن سبكترافيا
    title: قائمة على الهدف والكفاءات والتنفيذ المُثبت
    items:
      - title: رسالتنا
        text: تقديم حلول تكنولوجية متطورة تساعد عملاءنا على تسريع الأداء وتحقيق أهدافهم الاستراتيجية — وصياغة تحوّل رقمي هادف عبر الابتكار والتعاون والسعي الدائم نحو التميّز.
      - title: فريقنا
        text: أكثر من 20 عامًا من الخبرة العالمية في التقنيات المتطورة ومنتجات المؤسسات. يبني مهندسونا ومبتكرونا ومطوّرونا حلولًا ذكية وغامرة وجاهزة للمستقبل.
      - title: خدماتنا
        text: تصميم التجارب الغامرة والذكاء الاصطناعي والتعلّم الرقمي وهندسة البرمجيات المخصّصة — من الفكرة والبنية إلى النشر والتحسين المستمر.
  - id: services
    eyebrow: ماذا نقدّم
    title: قدرات تدفع المؤسسات إلى الأمام
    lead: ثلاثة مجالات خدمة متكاملة، نقدّمها بالتعاون مع شركاء تقنيين عالميين.
  - id: industries
    eyebrow: القطاعات
    title: مصمّمة للقطاعات التي تحرّك المنطقة
    lead: من حقول النفط إلى قاعات المحاضرات، نكيّف التقنيات المُثبتة مع واقع كل قطاع.
  - id: partners
    eyebrow: التمثيل في الشرق الأوسط وأفريقيا
    title: مبتكرون عالميون وخبرة إقليمية
    lead: نفخر بتمثيل شركات تكنولوجيا رائدة في الشرق الأوسط وأفريقيا.

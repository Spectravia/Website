# مسودة ترجمة — تحتاج إلى مراجعة من متحدث أصلي
title: حلول الذكاء الاصطناعي والواقع الممتد في الشرق الأوسط
description: تساعد Spectravia، ومقرّها الإمارات، المؤسسات في الشرق الأوسط وأفريقيا على تبنّي الذكاء الاصطناعي وتدريب فرقها بالواقع الممتد وبناء منصات مؤسسية تحقّق النتائج.
hero:
  eyebrow: استراتيجية الذكاء الاصطناعي · الواقع الممتد · منصات المؤسسات
  title: ذكاء اصطناعي وواقع ممتد ومنصات مؤسسية
  highlight: تدرّب فرقك وتجهّزها وتحوّل أداءها
  lead: من مقرّنا في الإمارات، نساعد المؤسسات في الشرق الأوسط وأفريقيا على بناء قدراتها في الذكاء الاصطناعي، وتدريب موظفيها بالواقع الممتد، وتشغيل أعمالها على منصات نطوّرها داخليًا، من أول ورشة عمل حتى النشر الكامل.
  primaryCta:
    label: احجز مكالمة لمدة 30 دقيقة
    to: /contact?topic=call
  secondaryCta:
    label: اطّلع على نتائجنا
    to: /case-studies
sections:
  - id: intro
    image: /images/brand/innovation-studio.webp
    eyebrow: من نحن
    title: تكنولوجيا يستخدمها فريقك فعلًا
    text: |
      Spectravia شركة تكنولوجيا مقرّها الإمارات وتخدم منطقة الشرق الأوسط وأفريقيا. نحوّل الذكاء الاصطناعي والواقع الممتد وبرمجيات المؤسسات إلى مهارات وأدوات ومنصات تستخدمها فرقك كل يوم.
  - id: pillars
    eyebrow: عن Spectravia
    title: قائمة على الهدف والكفاءات والتنفيذ المُثبت
    items:
      - title: رسالتنا
        text: تقديم حلول تكنولوجية متطورة تساعد عملاءنا على تسريع الأداء وتحقيق أهدافهم الاستراتيجية — وصياغة تحوّل رقمي هادف عبر الابتكار والتعاون والسعي الدائم نحو التميّز.
      - title: فريقنا
        text: أكثر من 20 عامًا من الخبرة القيادية المجتمعة في التقنيات المتطورة ومنتجات المؤسسات. يبني مهندسونا ومبتكرونا ومطوّرونا حلولًا ذكية وغامرة وجاهزة للمستقبل.
      - title: خدماتنا
        text: استراتيجية الذكاء الاصطناعي والتدريب عليه، والواقع الممتد، وهندسة المنصات المخصّصة — من الفكرة والبنية إلى النشر والتحسين المستمر.
  - id: services
    eyebrow: ماذا نقدّم
    title: قدرات تدفع المؤسسات إلى الأمام
    lead: ثلاثة مجالات خدمة متكاملة. نبني حلول الذكاء الاصطناعي والمنصات داخليًا، ونقدّم حلول الواقع الممتد المتخصّصة مع شركاء عالميين.
  - id: industries
    eyebrow: القطاعات
    title: مصمّمة للقطاعات التي تحرّك المنطقة
    lead: من حقول النفط إلى قاعات المحاضرات، نكيّف التقنيات المُثبتة مع واقع كل قطاع.
  - id: cases
    eyebrow: دراسات الحالة
    title: أثر مُثبت ونتائج قابلة للقياس
    lead: مجموعة مختارة من مشاريع الذكاء الاصطناعي والواقع الممتد المنفّذة في المنطقة.
    cta:
      label: عرض جميع دراسات الحالة
      to: /case-studies
  - id: partners
    eyebrow: شركاؤنا
    title: نبني داخليًا، ونتوسّع مع متخصّصين عالميين
    lead: نصمّم حلول الذكاء الاصطناعي والمنصات ونبنيها داخليًا. وللاحتياجات المتخصّصة، نمثّل روّادًا عالميين في الشرق الأوسط وأفريقيا — Fifth Ingenium للواقع الممتد الصناعي، وBlippar للواقع المعزّز، وNext World للتدريب على السلامة بالواقع الافتراضي، وRPM Training Solutions لبرامج الأداء.

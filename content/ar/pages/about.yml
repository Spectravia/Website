# مسودة ترجمة — تحتاج إلى مراجعة من متحدث أصلي
title: من نحن
description: تعرّف على فريق قيادة Spectravia والرسالة التي تقود عملنا في الذكاء الاصطناعي والتقنيات الغامرة والتحوّل الرقمي.
hero:
  eyebrow: عن Spectravia
  title: تقنيون واستراتيجيون وبنّاؤون
  lead: فريق قيادي يتمتّع بعقود من الخبرة في الواقع الممتد وهندسة البرمجيات والتحوّل الرقمي — في الشرق الأوسط وأفريقيا والأسواق العالمية.
sections:
  - id: mission
    eyebrow: رسالتنا
    title: صياغة تحوّل رقمي هادف
    text: |
      تتمثّل رسالتنا في Spectravia في تقديم حلول تكنولوجية متطورة تساعد عملاءنا على تسريع الأداء وتحقيق أهدافهم الاستراتيجية. ونلتزم بصياغة تحوّل رقمي هادف عبر الابتكار والتعاون والسعي الدائم نحو التميّز.

      وبفضل أكثر من 20 عامًا من الخبرة القيادية المجتمعة في التقنيات المتطورة ومنتجات المؤسسات، نضع خبرة عميقة في كل مشروع ننفّذه. يضمّ فريقنا مهندسين ومبتكرين ومطوّرين ذوي كفاءة عالية، يجمعهم الشغف ببناء حلول ذكية وغامرة وجاهزة للمستقبل تمكّن المؤسسات من النمو والتحوّل والريادة.
  - id: values
    eyebrow: كيف نعمل
    title: المبادئ التي تقود كل مشروع
    items:
      - title: ابتكار عملي
        text: تقنيات تحلّ مشكلات حقيقية وتتلاءم مع العمليات الفعلية — لا تجارب لذاتها.
        icon: lucide:lightbulb
      - title: محوره الإنسان
        text: حلول مصمّمة حول مستخدميها، مع التدريب ودعم التبنّي منذ البداية.
        icon: lucide:users
      - title: موجّه نحو النتائج
        text: أهداف واضحة وأثر قابل للقياس، من المشروع التجريبي الأول حتى النشر الكامل.
        icon: lucide:target
      - title: عمق إقليمي
        text: علاقات راسخة ومعرفة واسعة بأسواق الشرق الأوسط وأفريقيا.
        icon: lucide:globe
  - id: team
    eyebrow: فريق القيادة
    title: الفريق الذي يقف وراء Spectravia
  - id: statement
    text: يجب أن يكون الابتكار عمليًا ومتمحورًا حول الإنسان وموجّهًا نحو النتائج — طيفًا من الحلول الذكية يُقدَّم عبر مسار واضح وهادف.

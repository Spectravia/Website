# مسودة ترجمة — تحتاج إلى مراجعة من متحدث أصلي
title: شركاؤنا
description: تمثّل Spectravia كلًا من Fifth Ingenium وBlippar وNext World وRPM Training Solutions في الشرق الأوسط وأفريقيا.
hero:
  eyebrow: شركاؤنا
  title: مبتكرون عالميون، نمثّلهم في الشرق الأوسط وأفريقيا
  lead: نعمل جنبًا إلى جنب مع شركات تكنولوجيا عالمية المستوى — لتقديم حلول مؤثّرة في الذكاء الاصطناعي والواقع المعزّز والواقع الافتراضي والمنصات الرقمية المتقدّمة.
sections:
  - id: intro
    eyebrow: لماذا يهمّك ذلك
    title: شريك إقليمي واحد، ومحفظة من الحلول المُثبتة
    text: |
      عملنا على مرّ السنين مع مبتكرين عالميين مثل Fifth Ingenium وBlippar وNext World وRPM Training Solutions، وقدّمنا تقنياتهم إلى السوق بفضل معرفتنا الإقليمية وعلاقاتنا في القطاع وخبرتنا الطويلة في أسواق الشرق الأوسط وأفريقيا.

      ويعني ذلك لعملائنا جهة تواصل واحدة مسؤولة — من العرض التوضيحي الأول والمشروع التجريبي إلى النشر والتدريب والدعم المستمر.

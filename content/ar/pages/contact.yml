# مسودة ترجمة — تحتاج إلى مراجعة من متحدث أصلي
title: تواصل معنا
description: تواصل مع Spectravia لمناقشة مشاريع الذكاء الاصطناعي والواقع الغامر ومنصات المؤسسات في الشرق الأوسط وأفريقيا.
hero:
  eyebrow: تواصل معنا
  title: لنبقَ على تواصل
  lead: أخبرنا عن التحدّي الذي تواجهه، وسيتواصل معك أحد مستشاري Spectravia.
sections:
  - id: aside
    title: لنبنِ المستقبل معًا
    text: |
      سواء كنت تستكشف التدريب الغامر، أو تخطّط لاستراتيجية ذكاء اصطناعي، أو تحتاج إلى منصة مصمّمة للتوسّع، فإن مستشارينا على استعداد لمساعدتك.

      تفضّل البريد الإلكتروني؟ راسلنا مباشرة وسنحيل طلبك إلى المختص المناسب.

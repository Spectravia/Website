# مسودة ترجمة — تحتاج إلى مراجعة من متحدث أصلي
title: خدماتنا
description: حلول الواقع الغامر للمؤسسات، وتطوير تطبيقات ومنصات المؤسسات، وبناء استراتيجية الذكاء الاصطناعي من الأساس.
hero:
  eyebrow: خدماتنا
  title: نقود التقدّم التكنولوجي بابتكارات متطورة
  lead: قدرات متكاملة في التقنيات الغامرة وبرمجيات المؤسسات والذكاء الاصطناعي — نقدّمها مع شركاء عالميين وبمعرفة إقليمية عميقة.
sections:
  - id: partners
    eyebrow: نمثّل روّاد التكنولوجيا في الشرق الأوسط وأفريقيا
    title: شركاؤنا
    lead: نتعاون مع شركات رائدة في قطاع العلوم والتكنولوجيا لدفع عجلة الابتكار وخلق فرص جديدة. يشاركنا شركاؤنا رؤيتنا لمستقبل أذكى وأكثر انغماسًا وترابطًا — ونقدّم تقنياتهم إلى أسواق الشرق الأوسط وأفريقيا بفضل معرفتنا الإقليمية العميقة وعلاقاتنا القوية في القطاع وخبرتنا الطويلة.

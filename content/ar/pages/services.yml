# مسودة ترجمة — تحتاج إلى مراجعة من متحدث أصلي
title: خدماتنا
description: استراتيجية الذكاء الاصطناعي والتدريب عليه، والواقع الممتد، ومنصات المؤسسات، نبنيها داخليًا ونقدّمها مع شركاء عالميين في الشرق الأوسط وأفريقيا.
hero:
  eyebrow: خدماتنا
  title: ذكاء اصطناعي وواقع ممتد ومنصات، مصمّمة حول طريقة عمل فرقك
  lead: قدرات متكاملة في الذكاء الاصطناعي والتقنيات الغامرة وبرمجيات المؤسسات — نبنيها داخليًا، ونوسّعها مع شركاء عالميين، وندعمها بمعرفة إقليمية عميقة.
sections:
  - id: partners
    eyebrow: نمثّل روّاد التكنولوجيا في الشرق الأوسط وأفريقيا
    title: شركاؤنا
    lead: نصمّم حلول الذكاء الاصطناعي والمنصات ونبنيها داخليًا. وللاحتياجات المتخصّصة، نمثّل روّادًا عالميين في الشرق الأوسط وأفريقيا — Fifth Ingenium للواقع الممتد الصناعي، وBlippar للواقع المعزّز، وNext World للتدريب على السلامة بالواقع الافتراضي، وRPM Training Solutions لبرامج الأداء — ونقدّم تقنياتهم إلى السوق بفضل معرفتنا الإقليمية العميقة وعلاقاتنا الراسخة في القطاع.

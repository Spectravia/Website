bio: |
  Arnav Ghosh is a seasoned Technology Strategist and Product Innovation leader with deep expertise in building and scaling enterprise-grade cybersecurity and cloud solutions. With more than a decade of experience driving product strategy across global markets, he specializes in transforming complex technical ecosystems into high-impact, customer-centric platforms that accelerate business performance.

  Arnav's career spans 10+ years at Symantec's Global Security Operations Center, where he led product management for mission-critical managed security services supporting more than 500 enterprise customers worldwide. His work focused on designing and launching new product lines, shaping device support strategy, and orchestrating full lifecycle management across engineering, sales, and service delivery teams.

  At Accenture, Arnav advanced into senior product leadership, steering innovation initiatives, modernizing cybersecurity offerings, and aligning technical roadmaps with enterprise transformation goals. His approach blends structured product thinking with a strong command of engineering processes, from backlog prioritization and feature design to operational tooling and financial analysis.

  Known for his ability to bridge technology, business, and customer value, Arnav excels at building scalable systems, simplifying complexity, and delivering products that are secure, resilient, and future-ready. His work consistently reflects a commitment to strategic clarity, cross-functional collaboration, and measurable impact.

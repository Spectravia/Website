bio: |
  Preet is an accomplished technology entrepreneur, engineering leader and technologist with deep experience in designing and building complex software systems, intelligent applications and next-generation technology platforms. His expertise spans Artificial Intelligence, Machine Learning, Computer Vision, advanced algorithms, spatial computing, Augmented Reality (AR), Extended Reality (XR), WebAR, mobile platforms and distributed systems.

  With a strong foundation in software engineering, research and development, and large-scale technology architecture, Preet has worked across the entire technology stack — from algorithm design and computational systems to model development, software architecture, platform engineering and deployment. His technical interests lie particularly at the intersection of AI, computer vision, visual intelligence and real-time interactive systems.

  He combines first-principles engineering thinking with hands-on technology leadership, bringing the ability to navigate complex technical challenges, evaluate emerging architectures and translate advanced research and algorithms into robust, scalable software systems. His experience spans building technology from the ground up, leading multidisciplinary engineering teams and taking sophisticated technology platforms from research and prototyping through production.

  Blippar, former CEO & CTO: Led technology development and engineering for pioneering augmented reality platforms. Spearheaded the development of Blippbuilder and web-based SLAM technology, involving computer vision, spatial mapping, real-time tracking and interactive rendering. Worked at the forefront of browser-based immersive computing and advanced visual technologies.

  iKaaz, Co-founder: Co-founded a mobile payments technology company, building digital payment platforms and underlying technology infrastructure. The company was successfully acquired by Grab, Southeast Asia's leading super app.

  DreamWorks Animation, R&D Lead: Led the research and development team, driving advanced engineering and technology innovation. Worked on complex software systems and computational technologies in a demanding, research-intensive animation environment.

  Obopay (invested in by Nokia): Contributed to the engineering and development of mobile financial technology platforms, including Nokia Money, Union Money and Yes Money, involving mobile infrastructure, secure transactions and digital payment systems.

  Preet brings a combination of deep engineering understanding, research-oriented thinking and experience leading complex technology development. His approach is rooted in understanding technology at a fundamental level — the algorithms, models, data structures, computational methods and system architectures that underpin sophisticated software products.

  He is particularly interested in the evolution of intelligent systems, the intersection of AI and computer vision, multimodal computing, spatial intelligence and the engineering challenges involved in taking advanced models and algorithms into real-world applications.

  Having worked across research-driven environments, technology startups and large-scale product development, he understands the technical trade-offs involved in building systems that are not only innovative but also performant, reliable, scalable and maintainable.

  Known for his structured problem-solving, technical curiosity and ability to simplify complex engineering challenges, Preet has led teams through the development of sophisticated technology platforms and continues to explore the possibilities emerging from advances in AI, machine learning and computational technologies.

bio: |
  Preet Prasannan is an accomplished technology entrepreneur, engineering leader, and business development strategist who bridges engineering excellence, product innovation, and commercial growth. His experience spans Artificial Intelligence (AI), Computer Vision, Augmented Reality (AR), Extended Reality (XR), WebAR, mobile technology, payments, and digital innovation. He has built a career focused on transforming ideas into scalable digital solutions that deliver measurable business impact.

  Throughout his career, Preet has held leadership positions across technology startups, global enterprises, and high-growth innovation companies. As CEO and former CTO of Blippar, he spearheaded the development of next-generation AR platforms, including Blippbuilder and web-based SLAM technology, helping establish the company as a recognized innovator in augmented reality experiences.

  As Co-founder of iKaaz, Preet helped build a mobile payments technology company that was successfully acquired by Grab, Southeast Asia's leading ride-hailing and super app platform. His entrepreneurial journey demonstrates a strong ability to identify market opportunities, build scalable technology solutions, and create value through innovation and execution.

  Earlier in his career, Preet served as R&D Lead at DreamWorks Animation, where he led research and development initiatives focused on engineering and technology innovation. His experience also includes contributions to mobile financial platforms at Obopay, supporting solutions such as Nokia Money, Union Money, and Yes Money.

  Preet's expertise spans technology leadership, product engineering, entrepreneurial ventures, mobile payments, digital platforms, immersive technologies, and enterprise solutions. He has extensive experience building scalable technology products, architecting complex systems, leading engineering teams, and translating business opportunities into innovative, market-ready solutions. His work consistently sits at the intersection of emerging technologies and business strategy.

  With a hands-on approach to innovation and execution, Preet focuses on developing technology capabilities that solve real-world problems, enhance operational efficiency, and create measurable business value. His ability to combine technical depth with commercial insight enables organizations to accelerate growth while maintaining a strong focus on customer outcomes.

  With a strong foundation in software engineering, immersive experiences, security, payments technology, and high-scale applications, Preet brings a rare blend of entrepreneurial vision, deep technical expertise, and large-scale technology leadership. Known for his structured thinking, collaborative leadership style, and ability to simplify complexity, he is a trusted advisor to organizations seeking to innovate, scale, and compete in a rapidly evolving digital landscape.

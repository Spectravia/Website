title: Education & Universities
summary: Immersive, collaborative learning that brings complex subjects to life.
challenges:
  - Abstract, three-dimensional subjects that are hard to teach in 2D
  - Limited lab time, equipment and specimens
  - Engaging students in hybrid and remote classes
  - Building lasting digital-teaching capability in faculty
solutions:

title: AI, XR & Enterprise Platforms in the Middle East
description: UAE-based Spectravia helps organizations across the Middle East and Africa adopt AI, train teams with immersive XR and build enterprise platforms that deliver results.
hero:
  eyebrow: AI strategy · XR · Enterprise platforms
  title: AI, XR and enterprise platforms that
  highlight: train, equip and transform teams
  lead: From our base in the UAE, we help organizations across the Middle East and Africa build AI capability, train their people with immersive XR and run on platforms we engineer in-house, from the first workshop to full deployment.
  primaryCta:
    label: Book a 30-minute call
    to: /contact?topic=call
  secondaryCta:
    label: See our results
    to: /case-studies
sections:
  - id: proof
    items:
      - title: "40%"
        text: less rework in field maintenance
        to: /case-studies/atex-field-operations-drilling
      - title: "96%+"
        text: accuracy of our Saudi-accent Arabic AI agent
        to: /case-studies/ai-call-center-agent
      - title: "90%"
        text: fewer days overdue with an AI collections agent
        to: /case-studies/ai-voice-agent-collections
      - title: "20,000"
        text: call minutes handled by AI every month
        to: /case-studies/ai-call-center-agent
  - id: services
    eyebrow: What we do
    title: Capabilities that move organizations forward
    lead: Three complementary service lines. AI and platforms are built in-house; specialist XR is delivered with world-class partners.
  - id: how
    eyebrow: How we work
    title: A clear path from idea to impact
    lead: Every engagement follows four steps, so you see value early and scale with confidence.
    items:
      - title: Discover
        text: We map your goals, teams and systems, and pick the use cases with the clearest return.
        icon: lucide:search
      - title: Pilot
        text: A focused pilot proves value with real users and measurable targets, in weeks rather than months.
        icon: lucide:flask-conical
      - title: Deploy
        text: We roll out at scale, integrated with your systems, security and processes.
        icon: lucide:rocket
      - title: Adopt
        text: Training, change support and continuous improvement keep the solution paying off.
        icon: lucide:trending-up
  - id: industries
    eyebrow: Industries
    title: Built for the sectors that power the region
    lead: From oil fields to lecture halls, we tailor proven technologies to the realities of each industry.
  - id: cases
    eyebrow: Case studies
    title: Proven impact, measured results
    lead: A selection of AI and extended reality projects delivered across the region.
    cta:
      label: View all case studies
      to: /case-studies
  - id: partners
    eyebrow: Our partners
    title: Built in-house, extended by global specialists
    lead: We design and build AI and platform solutions in-house. For specialist needs, we represent global leaders across the Middle East and Africa — Fifth Ingenium for industrial XR, Blippar for AR, Next World for VR safety training and RPM Training Solutions for performance programmes.
  - id: about
    eyebrow: Who we are
    title: Technology your people actually use
    text: |
      Spectravia is a technology company based in the UAE and serving the MEA region. We turn AI, XR and enterprise software into skills, tools and platforms your teams use every day, led by a team with 20+ years of combined leadership experience.
    cta:
      label: Meet the team
      to: /about

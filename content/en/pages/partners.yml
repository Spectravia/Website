sections:
  - id: intro
    eyebrow: Why it matters
    title: One regional partner, a portfolio of proven solutions
    text: |
      Over the years we have worked alongside global innovators such as Fifth Ingenium, Blippar, Next World and RPM Training Solutions, bringing their technologies to market through our regional knowledge, industry relationships and long-standing experience in MEA markets.

      For our clients this means a single, accountable point of contact — from the first demo and pilot to deployment, training and ongoing support.

title: AI Strategy & Training
summary: Train every team on AI, then turn that skill into a strategy, automation and AI agents that pay off.
text: |
  We follow a bottom-up approach to artificial intelligence, starting with foundational AI knowledge and gradually building toward advanced, organization-wide strategy. Our programs begin by equipping teams with essential concepts, practical skills and hands-on understanding, then progress into applied AI, automation, data intelligence and strategic adoption frameworks.

  This structured pathway ensures every stakeholder — from beginners to decision-makers — develops the confidence and capability needed to shape a complete, future-ready AI strategy that delivers real business impact.
features:
  - AI foundations for every team
  - Hands-on, applied AI workshops
  - AI agents for voice and chat, in Arabic and English
  - Computer vision and automation
  - AI for business leaders and decision-makers
  - Organization-wide AI strategy and governance
